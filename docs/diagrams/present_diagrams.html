<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نمایش تعاملی فرآیندهای کسب‌وکار سامانه اجاره خودرو | ارائه کلاسی</title>
    <!-- Google Font Vazirmatn -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --accent-gold: #f59e0b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', Tahoma, 'Segoe UI', Arial, sans-serif !important;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            color: #ffffff;
            padding: 20px 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-title p {
            font-size: 13px;
            color: #93c5fd;
            margin-top: 4px;
        }

        .team-badge {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            color: #e2e8f0;
            text-align: left;
            direction: ltr;
        }

        /* Navigation Tabs */
        .tabs-container {
            background: #ffffff;
            border-bottom: 2px solid #e2e8f0;
            padding: 0 30px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 16px 20px;
            font-size: 15px;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: var(--primary);
            background-color: #f8fafc;
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 700;
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 25px 30px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .diagram-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Toolbar */
        .toolbar {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-btn {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-btn:hover {
            background: #f1f5f9;
            border-color: #94a3b8;
            color: #0f172a;
        }

        .tool-btn.primary {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .tool-btn.primary:hover {
            background: var(--primary-dark);
        }

        /* Viewer Canvas */
        .canvas-wrapper {
            position: relative;
            background: #ffffff;
            min-height: 520px;
            height: 60vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
            border-bottom: 1px solid #e2e8f0;
        }

        .canvas-wrapper:active {
            cursor: grabbing;
        }

        .diagram-viewport {
            transform-origin: center center;
            transition: transform 0.1s ease-out;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .diagram-viewport img, .diagram-viewport svg {
            max-width: none;
            height: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border-radius: 8px;
        }

        /* Description Section */
        .diagram-info {
            padding: 24px 30px;
            background: #ffffff;
        }

        .diagram-info h3 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .info-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px 20px;
        }

        .info-box h4 {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .info-box p, .info-box ul {
            font-size: 13px;
            line-height: 1.8;
            color: #475569;
        }

        .info-box ul {
            list-style-position: inside;
            padding-right: 6px;
        }

        /* Fullscreen styles */
        :fullscreen .canvas-wrapper {
            height: 90vh;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <h1>🚗 ارائه فرآیندهای کسب‌وکار سامانه اجاره خودرو</h1>
            <p>پروژه پایانی درس طراحی سیستم‌های تحت وب | رندر برداری ۳X Ultra-HD و بدون افت کیفیت</p>
        </div>
        <div class="team-badge">
            <b>Pair Programming Team:</b> SoroushHamedi-Net & Noora-NF
        </div>
    </header>

    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchTab(1)">
            <span>۱.</span> ثبت درخواست و بررسی تداخل تقویم
        </button>
        <button class="tab-btn" onclick="switchTab(2)">
            <span>۲.</span> تأیید/رد مدیر و صدور قرارداد
        </button>
        <button class="tab-btn" onclick="switchTab(3)">
            <span>۳.</span> لغو درخواست مشتری و آزادسازی
        </button>
        <button class="tab-btn" onclick="switchTab(4)">
            <span>۴.</span> تحویل، بازرسی و چرخه تعمیرگاه
        </button>
    </div>

    <main>
        <div class="diagram-card">
            <div class="toolbar">
                <div class="toolbar-group">
                    <span id="current-title" style="font-weight: 700; font-size: 15px; color: #1e293b;">
                        فرآیند ۱: ثبت درخواست اجاره خودرو و بررسی هوشمند تداخل زمانی و موجودی
                    </span>
                </div>
                <div class="toolbar-group">
                    <button class="tool-btn" onclick="zoomIn()" title="بزرگ‌نمایی">🔍 بزرگ‌نمایی (+)</button>
                    <button class="tool-btn" onclick="zoomOut()" title="کوچک‌نمایی">🔎 کوچک‌نمایی (-)</button>
                    <button class="tool-btn" onclick="resetZoom()" title="اندازه واقعی">🔄 بازنشانی (۱۰۰٪)</button>
                    <button class="tool-btn" onclick="toggleFullscreen()" title="تمام صفحه">⛶ تمام‌صفحه</button>
                    <a id="btn-svg" href="process_1_rental_request.svg" target="_blank" class="tool-btn">📄 وکتور SVG</a>
                    <a id="btn-png" href="process_1_rental_request.png" target="_blank" class="tool-btn primary">📥 تصویر ۳X PNG</a>
                </div>
            </div>

            <div class="canvas-wrapper" id="canvas-wrapper">
                <div class="diagram-viewport" id="diagram-viewport">
                    <img id="diagram-img" src="process_1_rental_request.png" alt="Process Diagram">
                </div>
            </div>

            <div class="diagram-info" id="diagram-info">
                <!-- Injected via JS -->
            </div>
        </div>
    </main>

    <script>
        const DATA = {
            1: {
                title: "فرآیند ۱: ثبت درخواست اجاره خودرو و بررسی هوشمند تداخل زمانی و موجودی",
                png: "process_1_rental_request.png",
                svg: "process_1_rental_request.svg",
                objective: "تضمین سلامت تقویم رزرواسیون، اعتبارسنجی تاریخ‌ها، محاسبه خودکار پیش‌فاکتور بر مبنای نرخ اسنپ‌شات و صدور کد یکتای رهگیری در وضعیت PENDING.",
                roles: "مشتری (Customer)، سیستم مرکزی (Django Core)، پایگاه‌داده (PostgreSQL)",
                steps: [
                    "مشتری خودرو و بازه زمانی start_date تا end_date را تعیین می‌کند.",
                    "سیستم صحت تاریخ‌ها (عدم انتخاب گذشته و تقدم پایان بر شروع) را بررسی می‌نماید.",
                    "سیستم وضعیت فیزیکی خودرو (AVAILABLE) و عدم تداخل با قراردادهای PENDING و APPROVED را با کوئری هم‌پوشانی چک می‌کند.",
                    "مبلغ کل (days * daily_price) محاسبه شده و رکورد با کد یکتای CR-XXXXXXXX در وضعیت PENDING ذخیره می‌شود."
                ]
            },
            2: {
                title: "فرآیند ۲: بررسی، تأیید یا رد درخواست اجاره توسط مدیر، صدور قرارداد و ارسال اعلان",
                png: "process_2_manager_review.png",
                svg: "process_2_manager_review.svg",
                objective: "گردش‌کار حاکمیتی مدیر ناوگان برای بررسی هویت مشتری، اجرای تراکنش اتمیک جهت جلوگیری از Race Condition، و تغییر وضعیت خودرو به RENTED.",
                roles: "مدیر ناوگان (Manager)، سیستم اعتبارسنجی (Core)، مشتری (Customer)",
                steps: [
                    "مدیر کارتابل درخواست‌های معلق (PENDING) را باز کرده و مدارک هویتی مشتری را بازبینی می‌کند.",
                    "در صورت رد (REJECTED): دلیل در manager_note ثبت و اعلان پیامکی برای مشتری ارسال می‌شود.",
                    "در صورت تأیید (APPROVED): سیستم در یک تراکنش اتمیک (transaction.atomic) مجدداً عدم برخورد همزمان را چک می‌کند.",
                    "وضعیت به APPROVED تغییر یافته، تقویم خودرو قفل شده و دستورالعمل تحویل به مشتری پیامک می‌شود."
                ]
            },
            3: {
                title: "فرآیند ۳: لغو درخواست اجاره توسط مشتری و آزادسازی منابع سیستم",
                png: "process_3_cancellation.png",
                svg: "process_3_cancellation.svg",
                objective: "امکان انصراف خودکار مشتریان با رعایت قوانین زمانی سامانه و آزادسازی بلادرنگ خودرو در تقویم رزرواسیون پایگاه‌داده.",
                roles: "مشتری (Customer)، موتور اعتبارسنجی لغو، مدیر ناوگان",
                steps: [
                    "مشتری از داشبورد سفارش‌های من درخواست لغو را ثبت می‌کند.",
                    "سیستم مجاز بودن وضعیت فعلی (PENDING یا APPROVED) را بررسی می‌نماید.",
                    "سیستم بررسی می‌کند که تاریخ جاری قبل از موعد تحویل (start_date) باشد (در غیر اینصورت خطا صادر می‌شود).",
                    "وضعیت قرارداد به CANCELLED تغییر یافته، بازه خودرو آزاد شده و هشدار به مدیر ارسال می‌گردد."
                ]
            },
            4: {
                title: "فرآیند ۴: بازگشت خودرو، بازرسی فنی و مدیریت چرخه وضعیت تعمیرگاه",
                png: "process_4_vehicle_return.png",
                svg: "process_4_vehicle_return.svg",
                objective: "خاتمه رسمی قرارداد، ثبت کیلومتر، بررسی دیرکرد زمانی، بازرسی کارشناسی بدنه و مدیریت انتقال خودرو به وضعیت MAINTENANCE و بازگشت به AVAILABLE.",
                roles: "مشتری (Customer)، کارشناس فنی / مدیر ناوگان، سیستم مرکزی",
                steps: [
                    "مشتری خودرو را در پایان موعد به ایستگاه تحویل می‌دهد.",
                    "سیستم در صورت وجود دیرکرد نسبت به end_date، جریمه روزانه دیرکرد را محاسبه می‌کند.",
                    "کارشناس بدنه و فنی را بازرسی می‌کند: در صورت نیاز به تعمیرات، وضعیت به MAINTENANCE تغییر می‌یابد.",
                    "پس از اتمام سرویس، خودرو مجدداً به وضعیت AVAILABLE بازگشته و قرارداد COMPLETED می‌شود."
                ]
            }
        };

        let currentTab = 1;
        let scale = 1.0;
        let isPanning = false;
        let startX, startY, currentX = 0, currentY = 0;

        const viewport = document.getElementById('diagram-viewport');
        const wrapper = document.getElementById('canvas-wrapper');
        const img = document.getElementById('diagram-img');
        const titleEl = document.getElementById('current-title');
        const infoEl = document.getElementById('diagram-info');
        const btnSvg = document.getElementById('btn-svg');
        const btnPng = document.getElementById('btn-png');

        function updateTransform() {
            viewport.style.transform = `translate(${currentX}px, ${currentY}px) scale(${scale})`;
        }

        function zoomIn() {
            scale = Math.min(scale * 1.25, 4.0);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(scale / 1.25, 0.4);
            updateTransform();
        }

        function resetZoom() {
            scale = 1.0;
            currentX = 0;
            currentY = 0;
            updateTransform();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.querySelector('.diagram-card').requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        // Pan handling
        wrapper.addEventListener('mousedown', (e) => {
            isPanning = true;
            startX = e.clientX - currentX;
            startY = e.clientY - currentY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isPanning) return;
            currentX = e.clientX - startX;
            currentY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isPanning = false;
        });

        wrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) {
                zoomIn();
            } else {
                zoomOut();
            }
        });

        function switchTab(num) {
            currentTab = num;
            const data = DATA[num];
            
            // Update buttons
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                if (idx + 1 === num) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Update image and links
            img.src = data.png;
            btnSvg.href = data.svg;
            btnPng.href = data.png;
            titleEl.innerText = data.title;

            // Render info
            let stepsHtml = data.steps.map(s => `<li>${s}</li>`).join('');
            infoEl.innerHTML = `
                <h3>📋 شرح تفصیلی و سناریوی کسب‌وکار</h3>
                <div class="info-grid">
                    <div class="info-box">
                        <h4>🎯 هدف اصلی فرآیند</h4>
                        <p>${data.objective}</p>
                    </div>
                    <div class="info-box">
                        <h4>👥 نقش‌های درگیر</h4>
                        <p>${data.roles}</p>
                    </div>
                    <div class="info-box" style="grid-column: 1 / -1;">
                        <h4>⚡ مراحل کلیدی و نقاط تصمیم‌گیری</h4>
                        <ul>${stepsHtml}</ul>
                    </div>
                </div>
            `;

            resetZoom();
        }

        // Initialize Tab 1
        switchTab(1);
    </script>
</body>
</html>
